name: Build and push Docker image to GHCR

# The image is the unit of deployment (docker-compose sets AUTO_UPDATE=0), so a
# versioned image is published per repo tag. Triggered by hand too
# (workflow_dispatch) so the first push does not require a new tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: luqman-v1/ocb

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # v2.4.0 → tags "2.4.0", "latest" (semver prefix stripped).
          # A workflow_dispatch build without a tag gets "edge" only, so the
          # versioned tags always point at a tagged commit.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.description=OpenAI-compatible bridge to OpenCode free-tier models

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse CI-tested layers; the repo is small so cache costs little.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The Dockerfile bakes the Bun version in (oven/bun:1.4.3-slim) — the
          # free-tier gate checks the TLS ClientHello, so the base is pinned and
          # latest=false on upstream tags is intentional. Fail loudly on
          # unpinned FROM to keep it that way.
          provenance: false

      - name: Verify the pinned base inside the published image
        if: ${{ steps.meta.outputs.version != '' }}
        run: |
          # The gate checks the TLS ClientHello; prove the image still carries
          # the pinned Bun before anyone deploys it.
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} bun transport-fingerprint.js --check
